<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>キロっく｜筋トレの記録を LINE で送る</title>
    <meta name="description" content="キロっく（kiloQ）。筋トレの種目・重さ・回数を記録して、LINE にカードで送れます。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="キロっく｜筋トレの記録を LINE で送る" />
    <meta property="og:description" content="筋トレの種目・重さ・回数を記録して、LINE にカードで送れます。" />
    <meta property="og:url" content="https://katsuan.github.io/line-workout-share/" />
    <meta property="og:site_name" content="キロっく（kiloQ）" />
    <meta property="og:image" content="https://katsuan.github.io/line-workout-share/ogp.png?v=20261019" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="キロっく（kiloQ）：筋トレの種目・重さ・回数を LINE にカードで送れる" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f7f4ef" />
    <!-- アイコン・ロゴ・OGP は tools/icon.py・tools/ogp.py で作る -->
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./style.css?v=202610211352" />
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="./config.js?v=202610211352"></script>
    <script type="module" src="./app.js?v=202610211352"></script>
    <script src="https://katsuan.github.io/line-share/shared/tool-share.js" data-tool="kiloq" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <!-- 見出しは1行：アイコン＋名前（左）と、横長のロゴ（右）。さくせん盤と同じ形 -->
      <header class="brand-row">
        <h1 class="brand-name"><img class="brand-icon" src="./icon.svg" alt="" width="28" height="28" />キロっく</h1>
        <img class="brand-logo" src="./logo.svg" alt="kiloQ" width="66" height="28" />
      </header>
      <p class="brand-copy">キロを刻んで、記録を積もう</p>
      <section class="status-panel" id="status-panel" aria-live="polite"></section>

      <nav class="tab-nav" id="tab-nav" aria-label="メインタブ">
        <button class="tab-button is-active" data-tab="input" type="button">入力</button>
        <button class="tab-button" data-tab="history" type="button">履歴</button>
        <button class="tab-button" id="tab-button-ranking" data-tab="ranking" type="button" hidden>
          ランキング
        </button>
      </nav>

      <main class="tab-panels">
        <!-- 送信プレビューは入力の一番上に置く（入力しながら送る中身を確かめられる） -->
        <section class="tab-panel" id="tab-preview" hidden></section>
        <section class="tab-panel is-active" id="tab-input"></section>
        <section class="tab-panel" id="tab-history" hidden></section>
        <section class="tab-panel" id="tab-ranking" hidden></section>
      </main>
      <!-- 「📤 キロっくを紹介する」：おくるんで紹介カードを送る窓口（line-share/shared/tool-share.js。中身は line-share/data/hub-links.json） -->
      <div data-tool-share></div>
    </div>

    <div class="action-bar" id="action-bar">
      <button class="action-button secondary" id="copy-json-button" type="button" hidden>
        Flex JSONコピー
      </button>
      <!-- LINE の外で開いたとき（送り先選びが使えないとき）だけ出す。ログインか LINE アプリで送れる環境へ移る。入力は持っていく -->
      <div class="line-help" id="line-help" hidden>
        <p class="line-help-text">LINE の外で開いています。送るには、どちらかから：</p>
        <div class="line-help-actions">
          <button class="line-help-button" id="line-login-button" data-action="line-login" type="button">🔑 ログインして送る</button>
          <a class="line-help-button is-app" id="line-app-link" href="#">💬 LINE アプリで開く</a>
        </div>
      </div>
      <button class="action-button primary" id="share-button" type="button">LINEで共有</button>
    </div>
  </body>
</html>
