<!DOCTYPE html>
<html lang="ja" data-ls-dark="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>キロっく｜筋トレの記録を LINE で送る</title>
    <meta name="description" content="キロっく（kiloQ）。筋トレの種目・重さ・回数を記録して、LINE にカードで送れます。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="キロっく｜筋トレの記録を LINE で送る" />
    <meta property="og:description" content="筋トレの種目・重さ・回数を記録して、LINE にカードで送れます。" />
    <meta property="og:url" content="https://katsuan.github.io/line-workout-share/" />
    <meta property="og:site_name" content="キロっく（kiloQ）" />
    <meta property="og:image" content="https://katsuan.github.io/line-workout-share/ogp.png?v=20261019" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="キロっく（kiloQ）：筋トレの種目・重さ・回数を LINE にカードで送れる" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f7f4ef" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#16151a" media="(prefers-color-scheme: dark)">
    <!-- アイコン・ロゴ・OGP は tools/icon.py・tools/ogp.py で作る -->
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- 部品（見出しの行・タブ・カード・チップ・入力欄・ボタン・開閉・シート・送る帯・トースト）はおくるんの Q キット。キロっくの CSS より前に読む -->
    <link rel="stylesheet" href="https://katsuan.github.io/line-share/shared/ui.css" />
    <link rel="stylesheet" href="./style.css?v=202610230036" />
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://katsuan.github.io/line-share/shared/ui.js" defer></script>
    <script src="./config.js?v=202610230036"></script>
    <script type="module" src="./app.js?v=202610230036"></script>
    <script src="https://katsuan.github.io/line-share/shared/tool-share.js" data-tool="kiloq" defer></script>
  </head>
  <body>
    <div class="ls-page app-shell">
      <!-- 見出しは1行：アイコン＋名前（左）と、横長のロゴ（右）。Q キットの見出しの行 -->
      <header class="ls-brand">
        <h1 class="ls-brand-name"><img class="ls-brand-icon" src="./icon.svg" alt="" width="28" height="28" />キロっく</h1>
        <img class="ls-brand-logo" src="./logo.svg" alt="kiloQ" width="66" height="28" />
      </header>
      <p class="ls-brand-copy">キロを刻んで、記録を積もう</p>
      <!-- 知らせは Q キットのトースト（下に数秒）。ui.js が読めないときだけ、ここに出す -->
      <p class="status-fallback" id="status-fallback" aria-live="polite" hidden></p>

      <nav class="ls-tabs tab-nav" id="tab-nav" role="tablist" aria-label="メインタブ">
        <button class="ls-tab" data-tab="input" type="button" role="tab" aria-selected="true">入力</button>
        <button class="ls-tab" data-tab="history" type="button" role="tab" aria-selected="false">履歴</button>
        <button class="ls-tab" id="tab-button-ranking" data-tab="ranking" type="button" role="tab" aria-selected="false" hidden>
          ランキング
        </button>
      </nav>

      <main class="tab-panels">
        <!-- 送信プレビューは入力の一番上に置く（入力しながら送る中身を確かめられる） -->
        <section class="tab-panel" id="tab-preview" hidden></section>
        <section class="tab-panel" id="tab-input"></section>
        <section class="tab-panel" id="tab-history" hidden></section>
        <section class="tab-panel" id="tab-ranking" hidden></section>
      </main>
      <!-- 「📤 キロっくを紹介する」：おくるんで紹介カードを送る窓口（line-share/shared/tool-share.js。中身は line-share/data/hub-links.json） -->
      <div data-tool-share></div>
    </div>

    <!-- 下に固定する送る帯（Q キットの ls-sendbar。文字の入力中はキーボードと重ならないよう隠れる） -->
    <div class="ls-sendbar" id="action-bar">
      <div class="ls-sendbar-inner">
        <!-- LINE の外で開いたとき（送り先選びが使えないとき）だけ出す。ログインか LINE アプリで送れる環境へ移る。入力は持っていく -->
        <div class="ls-outside" id="line-help" hidden>
          <p class="ls-outside-text">LINE の外で開いています。送るには：</p>
          <div class="ls-outside-actions">
            <button class="ls-outside-button" id="line-login-button" data-action="line-login" type="button">🔑 ログインして送る</button>
            <a class="ls-outside-button is-app" id="line-app-link" href="#">💬 LINE アプリで開く</a>
          </div>
        </div>
        <div class="ls-sendbar-row">
          <button class="ls-send ls-send-secondary" id="copy-json-button" type="button" hidden>Flex JSONコピー</button>
          <button class="ls-send is-line" id="share-button" type="button">💬 LINEで送る</button>
        </div>
      </div>
    </div>
    <!-- はじめて開いた人にだけ、短い使い方（Q キットの firstTip。「わかった」で消え、この端末では次から出ない） -->
    <script>
      addEventListener("load", () => {
        window.LineShareUI?.firstTip("kiloq", ["部位 → 種目を選んで、重さと回数を入れる", "よくやる組み合わせは「メニュー」に保存できます", "「💬 LINEで送る」で、記録をカードで送れます"], document.getElementById("tab-nav"));
      });
    </script>
    <!-- 電波がなくても開けるように（sw.js） -->
    <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});</script>
  </body>
</html>
